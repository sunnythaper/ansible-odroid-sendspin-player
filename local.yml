---
- name: Configure an Odroid C2 as a Sendspin TUI appliance
  hosts: all
  connection: local
  become: true
  force_handlers: true

  roles:
    - role: hostname
    - role: ansible_pull_timer
    - role: packages
    - role: hifi_shield2
    - role: sendspin_user
    - role: uv
    - role: sendspin
    - role: sendspin_config
    - role: sendspin_tui_service

  handlers:
    - name: Reboot the appliance
      ansible.builtin.command: shutdown -r --no-wall +1
      changed_when: true
      when: sendspin_allow_reboot | bool

  post_tasks:
    - name: Report the pending HiFi Shield 2 activation
      ansible.builtin.debug:
        msg:
          - The HiFi Shield 2 device tree overlay has been installed.
          - The device will reboot now and complete setup on the next convergence run.
      when: not (hifi_shield2_audio_ready | default(false))

    - name: Show the converged appliance state
      when: hifi_shield2_audio_ready | default(false)
      block:
        - name: Show ALSA playback devices
          ansible.builtin.command: aplay -l
          register: verify_aplay
          changed_when: false

        - name: Show sendspin audio devices
          ansible.builtin.command: "{{ sendspin_daemon_home }}/.local/bin/sendspin audio-devices list"
          become: true
          become_user: "{{ sendspin_daemon_user }}"
          register: verify_devices
          changed_when: false
          failed_when: false

        - name: Show the sendspin TUI service status
          ansible.builtin.command: systemctl --no-pager status sendspin-tui  # noqa: command-instead-of-module
          register: verify_status
          changed_when: false
          failed_when: false

        - name: Print convergence summary
          ansible.builtin.debug:
            msg:
              - "{{ verify_aplay.stdout_lines }}"
              - "{{ verify_devices.stdout_lines }}"
              - "{{ verify_status.stdout_lines }}"
