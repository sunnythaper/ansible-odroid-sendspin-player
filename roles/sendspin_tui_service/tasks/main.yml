---
- name: Mask the getty on tty1
  ansible.builtin.file:
    src: /dev/null
    dest: /etc/systemd/system/getty@tty1.service
    state: link
    force: true

- name: Disable kernel console blanking
  ansible.builtin.shell: |
    set -euo pipefail
    if grep -q '^extraoptions=.*consoleblank=' /boot/armbianEnv.txt; then
      exit 0
    fi
    if grep -q '^extraoptions=' /boot/armbianEnv.txt; then
      sed -i 's/^extraoptions=.*/& consoleblank=0/' /boot/armbianEnv.txt
    else
      printf 'extraoptions=consoleblank=0\n' >> /boot/armbianEnv.txt
    fi
    echo CHANGED
  register: sendspin_tui_service_consoleblank
  changed_when: "'CHANGED' in sendspin_tui_service_consoleblank.stdout"
  notify: Reboot the appliance

- name: Remove the obsolete console blanking unit
  ansible.builtin.file:
    path: /etc/systemd/system/consoleblank-off.service
    state: absent

- name: Remove the obsolete console blanking enablement
  ansible.builtin.file:
    path: /etc/systemd/system/multi-user.target.wants/consoleblank-off.service
    state: absent

- name: Install the sendspin TUI service
  ansible.builtin.template:
    src: sendspin-tui.service.j2
    dest: /etc/systemd/system/sendspin-tui.service
    mode: "0644"
  notify: Restart the sendspin TUI

- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable the sendspin TUI service
  ansible.builtin.systemd:
    name: sendspin-tui
    enabled: true
  when: hifi_shield2_audio_ready | default(false)

- name: Start the sendspin TUI service
  ansible.builtin.systemd:
    name: sendspin-tui
    state: started
  when: hifi_shield2_audio_ready | default(false)
